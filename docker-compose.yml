services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    restart: on-failure
  client:
    depends_on:
      - server
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_WS_SERVER_URL: ${VITE_WS_SERVER_URL:-ws://localhost:3000}
    ports:
      - "8080:80"
    restart: on-failure
